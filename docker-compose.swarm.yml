version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: courseit
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d courseit"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: cavassingomes/courseit-be:latest
    depends_on: 
      - db 
    environment:
      DATABASE_URL: postgresql://admin:admin@db:5432/courseit?schema=public
      PORT: 3030
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure 
        delay: 10s
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    ports:
      - "3030:3030"
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: overlay